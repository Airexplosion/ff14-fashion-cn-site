<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FF14 时尚品鉴参考</title><style>
:root {
  --bg:#070d18; --bg2:#0b1425; --panel:#0f1728; --panel2:#121d33; --line:#25375b;
  --text:#eef4ff; --muted:#98a8c7; --brand:#84c5ff; --ok:#8ce99a; --warn:#ffd166; --soft:#1b2844;
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text)}
a{color:#bfe4ff;text-decoration:none} a:hover{text-decoration:underline}
.wrap{max-width:1380px;margin:0 auto;padding:24px 18px 72px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.nav{display:flex;gap:10px;flex-wrap:wrap}.nav a{padding:10px 14px;border:1px solid #37558f;background:#17233d;border-radius:999px;color:#e8f2ff}
.hero,.panel,.slot-card{background:rgba(15,23,40,.92);border:1px solid var(--line);border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.28)}
.hero{padding:28px;background:radial-gradient(circle at right top, rgba(132,197,255,.16), transparent 30%), rgba(15,23,40,.96)}
h1,h2,h3{line-height:1.2;margin:0 0 12px} h1{font-size:34px} h2{font-size:24px} h3{font-size:18px}
p{line-height:1.75;margin:8px 0}.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px;margin-top:18px}.col-12{grid-column:span 12}.col-8{grid-column:span 8}.col-4{grid-column:span 4}
@media(max-width:980px){.col-8,.col-4,.col-12{grid-column:span 12}h1{font-size:28px}}
.panel{padding:20px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}@media(max-width:980px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{padding:16px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.03)} .stat .value{font-size:26px;font-weight:800;margin-bottom:6px}
.ok{color:var(--ok)} .warn{color:var(--warn)}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.chip{padding:7px 12px;border-radius:999px;background:#1a2947;border:1px solid #335391;font-size:13px;color:#dce9ff}
.slot-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}@media(max-width:980px){.slot-grid{grid-template-columns:1fr}}
.slot-card{padding:18px}
.item-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}@media(max-width:700px){.item-grid{grid-template-columns:1fr}}
.item{display:grid;grid-template-columns:68px 1fr;gap:12px;padding:12px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.item img{width:68px;height:68px;border-radius:14px;background:#1a2740;object-fit:contain;padding:6px;border:1px solid #314d82}
.item-name{font-size:16px;font-weight:700;margin-bottom:4px}.meta{font-size:13px;color:var(--muted)}
.badge{display:inline-block;padding:4px 9px;border-radius:999px;font-size:12px;margin-top:6px;border:1px solid var(--line)} .badge.ok{background:rgba(140,233,154,.1)} .badge.warn{background:rgba(255,209,102,.12)}
.note{border-left:4px solid var(--brand);padding:12px 14px;border-radius:14px;background:rgba(132,197,255,.08);margin-top:12px}
footer{margin-top:24px;color:var(--muted);font-size:13px}
</style></head><body><div class="wrap">
<div class="topbar"><div><strong>FF14 时尚品鉴参考</strong></div><div class="nav"><a href="./index.html">首页</a><a href="./table.html">搜索表格</a><a href="./history.html">往期题目</a><a href="./stats.html">题目统计</a><a href="https://github.com/Airexplosion/ff14-fashion-cn-site" target="_blank">GitHub</a></div></div>
<section class="hero"><h1>本周时尚品鉴参考</h1><p class="muted">按部位查看本周候选装备，支持中文部位、时尚品鉴词条中英对照、染色要求与灰机词条跳转。</p><div class="chips"><span class="chip">当前周：第 <span id="week"></span> 周</span><span class="chip">装备检索</span><span class="chip">部位中文</span><span class="chip">词条中英对照</span><span class="chip">染色要求</span></div><div class="stats"><div class="stat"><div class="value ok" id="slotCount">0</div><div>部位</div></div><div class="stat"><div class="value ok" id="itemCount">0</div><div>候选装备</div></div><div class="stat"><div class="value warn" id="wikiCount">0</div><div>已对到灰机词条</div></div><div class="stat"><div class="value" id="buildTime">-</div><div>更新时间</div></div></div></section>
<div class="grid"><section class="panel col-8"><h2>本周部位参考</h2><div class="slot-grid" id="slotGrid"></div></section><section class="panel col-4"><h2>使用说明</h2><div class="note"><strong>每个部位</strong><br>显示部位中文、部位英文、对应时尚品鉴词条中文与英文。</div><div class="note"><strong>染色</strong><br>若数据源提供染色要求，则直接显示染料中文；没有则显示“无指定染色”。</div><div class="note"><strong>词条</strong><br>已匹配的装备可直接跳转到灰机对应词条。</div></section></div>
<footer>数据整理自公开 Fashion Report 数据与中文物品资料，仅供时尚品鉴参考。</footer></div>
<script>
const DATA_URL = './site-data.json';
const fmt = t => new Date(t * 1000).toLocaleString('zh-CN', { hour12: false });
const esc = s => (s || '').replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));

async function loadData() {
  const resp = await fetch(DATA_URL, { cache: 'no-store' });
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  return resp.json();
}

function renderIndex(DATA) {
  const weekEl = document.getElementById('week');
  const slotCountEl = document.getElementById('slotCount');
  const itemCountEl = document.getElementById('itemCount');
  const wikiCountEl = document.getElementById('wikiCount');
  const buildTimeEl = document.getElementById('buildTime');
  const grid = document.getElementById('slotGrid');

  weekEl.textContent = DATA.week || '-';
  slotCountEl.textContent = DATA.slotSummary?.length || 0;
  itemCountEl.textContent = DATA.rows?.length || 0;
  wikiCountEl.textContent = (DATA.rows || []).filter(r => r.wikiMatched).length;
  buildTimeEl.textContent = DATA.generatedAt ? fmt(DATA.generatedAt) : '-';
  grid.innerHTML = '';

  (DATA.slotSummary || []).forEach(s => {
    const el = document.createElement('section');
    el.className = 'slot-card';
    el.innerHTML = `
      <h3>${esc(s.slotCn || s.slot)}</h3>
      <p class="muted">部位英文：${esc(s.slotEn || '')}</p>
      <p class="muted">词条中文：${esc(s.themeNameCn || s.themeNameEn || '—')}</p>
      <p class="muted">词条英文：${esc(s.themeNameEn || '')}</p>
      <p class="muted">染色：${esc(s.dyeDisplayCn || '无指定染色')}</p>
      <p class="muted">候选 ${s.candidateCount || 0} 件</p>
      <div class="item-grid">${(s.heroItems || []).map(item => `
        <div class="item">
          <img loading="lazy" src="${item.iconUrl || ''}" alt="${esc(item.nameCn)}">
          <div>
            <div class="item-name">${esc(item.nameCn)}</div>
            <div class="meta">物品ID：${item.itemId} · IL：${item.itemLevel}</div>
            <div class="meta">染色：${esc(item.dyeDisplayCn || '无指定染色')}</div>
            <div>${item.wikiUrl ? `<a href="${item.wikiUrl}" target="_blank" rel="noopener noreferrer">${esc(item.wikiPageTitle || '灰机词条')}</a>` : '—'}</div>
            <span class="badge ${item.wikiMatched ? 'ok' : 'warn'}">${item.wikiStatusText || (item.wikiMatched ? '已对词条' : '待补校验')}</span>
          </div>
        </div>
      `).join('')}</div>`;
    grid.appendChild(el);
  });
}

loadData().then(renderIndex).catch(err => {
  document.getElementById('slotGrid').innerHTML = `<div class="note"><strong>加载失败</strong><br>${esc(String(err))}</div>`;
});
</script></body></html>
