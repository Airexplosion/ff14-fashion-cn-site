name: Update and deploy FF14 fashion site

on:
  workflow_dispatch:
  schedule:
    - cron: '15 */6 * * *'

permissions:
  contents: write

concurrency:
  group: ff14-fashion-site-update
  cancel-in-progress: true

jobs:
  update-site-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests PyJWT cryptography

      - name: Generate site data
        run: python generate_site_data.py

      - name: Commit updated site data
        run: |
          if git diff --quiet -- site-data.json; then
            echo "No site-data changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site-data.json
            git commit -m "chore: update site data"
            git push
          fi
